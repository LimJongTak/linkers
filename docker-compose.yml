version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkers_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkers
      POSTGRES_PASSWORD: linkers
      POSTGRES_DB: linkers_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linkers']
      interval: 5s
      timeout: 5s
      retries: 5

  # 테스트용 별도 DB (포트 5433)
  postgres_test:
    image: postgres:16-alpine
    container_name: linkers_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkers
      POSTGRES_PASSWORD: linkers
      POSTGRES_DB: linkers_test
    ports:
      - '5433:5432'

volumes:
  postgres_data:
